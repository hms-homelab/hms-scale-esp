# The firmware build. Called by release.yml when a tag is pushed, and runnable
# by hand from the Actions tab to check a tree compiles before tagging it.
#
# There is deliberately no push or pull_request trigger: a tag build already
# covers the tree, and anything else would mean two runs for one change.
name: build firmware

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name for the uploaded artifact holding the staged binaries
        required: false
        default: firmware
        type: string
    outputs:
      version:
        description: Version parsed out of main/version.h
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

jobs:
  build:
    name: esp32c3
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # main/version.h is the single source of truth. CMakeLists.txt parses the
      # same line for PROJECT_VER; the assertion below proves the two agree.
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^#define[[:space:]][[:space:]]*HMS_SCALE_ESP_VERSION[[:space:]][[:space:]]*"\([^"]*\)".*/\1/p' main/version.h)
          if [ -z "$version" ]; then
            echo "::error file=main/version.h::could not parse HMS_SCALE_ESP_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building v$version"

      # esp_idf_version tracks the idf entry in dependencies.lock. The component
      # manager fetches espressif/mdns during the build from main/idf_component.yml;
      # managed_components/ and dependencies.lock are gitignored on purpose.
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.4
          target: esp32c3
          path: '.'
          # merge-bin resolves -o relative to the build directory, which is
          # already its working directory, so this lands at build/merged.bin.
          command: idf.py build && idf.py merge-bin -o merged.bin

      - name: Assert the build picked up version.h
        run: |
          built=$(python3 -c "import json;print(json.load(open('build/project_description.json'))['project_version'])")
          want='${{ steps.version.outputs.version }}'
          if [ "$built" != "$want" ]; then
            echo "::error::app descriptor says '$built' but main/version.h says '$want'"
            exit 1
          fi
          echo "app descriptor version: $built"

      # Two shapes: the app image for an OTA update from the web UI, and a full
      # flash image for a blank board or any board on a build whose OTA cannot
      # complete (v2.0.1 and earlier have no ota_0/ota_1 at all, and v2.0.2's
      # OTA reboots mid-upload), so their first hop must be over USB.
      - name: Stage artifacts
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir -p dist
          cp build/etekcity_scale_gateway.bin "dist/hms-scale-esp-$v.bin"
          cp build/merged.bin                 "dist/hms-scale-esp-$v-merged.bin"
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          # inputs is empty on a manual run, so fall back to a fixed name.
          name: ${{ inputs.artifact-name || 'firmware' }}
          path: dist/
          if-no-files-found: error
